services:

#1 Database container
  postgres:
    image: postgres:16-alpine
    container_name: event_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-42132130}
      POSTGRES_DB: ${DB_NAME:-event_management_systems}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 1. Named volume for persisting database data across container lifecycles
      - postgres_data:/var/lib/postgresql/data
      # 2. Bind mount to automatically run schema.sql on first startup
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-event_management_systems}"]
      interval: 7s
      timeout: 7s
      retries: 10


#2 backend container

  backend:
    build: ./backend
    image: backend_image:1.0
    container_name: event_management_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - postgres:
          condition: service_healthy

#3 frontend container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_SOCKET_URL: http://localhost:3000
    image: frontend_image:1.0          
    container_name: event_management_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend:
          condition: service_healthy


volumes:
  postgres_data:
    name: event_management_postgres_data
