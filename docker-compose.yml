services:
  postgres:
    image: postgres:16-alpine
    container_name: event_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-42132130}
      POSTGRES_DB: ${DB_NAME:-event_management_systems}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 1. Named volume for persisting database data across container lifecycles
      - postgres_data:/var/lib/postgresql/data
      # 2. Bind mount to automatically run schema.sql on first startup
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-event_management_systems}"]
      interval: 7s
      timeout: 7s
      retries: 10

volumes:
  postgres_data:
    name: event_management_postgres_data
